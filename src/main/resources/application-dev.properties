# ===================================
# Perfil DEV — desenvolvimento local
# ===================================
server.port=${PORT:9090}

# H2 em arquivo: os dados persistem entre reinicializações locais.
# AUTO_SERVER=TRUE permite abrir o H2 Console (outra conexão) com
# a aplicação já rodando. O arquivo fica em ./data/petfamily.mv.db
# (ignorado pelo git).
spring.datasource.url=jdbc:h2:file:./data/petfamily;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (acessar em http://localhost:9090/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
