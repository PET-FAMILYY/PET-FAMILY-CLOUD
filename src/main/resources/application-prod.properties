# ===================================
# Perfil PROD — Azure App Service + Azure Database for PostgreSQL
# ===================================
# Nenhum valor sensível fica aqui. Tudo vem de variável de ambiente,
# configurada no App Service por "az webapp config appsettings set"
# (ver azure/02-configure-app.sh). Sem esses valores a aplicação
# falha ao subir — de propósito, para não existir fallback inseguro
# em produção.

# App Service injeta a porta via variável de ambiente PORT.
server.port=${PORT:8080}

# Conexão obrigatoriamente por variável de ambiente. A URL deve
# incluir "sslmode=require" (SSL obrigatório no Azure Database for
# PostgreSQL Flexible Server) — ex.:
# jdbc:postgresql://<servidor>.postgres.database.azure.com:5432/<banco>?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 Console não existe neste perfil (nem no classpath de execução
# real importa — fica desabilitado por garantia).
spring.h2.console.enabled=false
