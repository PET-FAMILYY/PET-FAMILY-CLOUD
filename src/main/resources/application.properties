# ===================================
# Pet Family API - Configurações comuns
# ===================================
# Este arquivo só tem o que é igual em qualquer ambiente.
# Configuração específica de banco/porta fica em application-{perfil}.properties:
#   application-dev.properties  -> H2 em arquivo (local)
#   application-prod.properties -> PostgreSQL (Azure)
# Perfil de teste automatizado: src/test/resources/application-test.properties (H2 em memória)

spring.application.name=Pet Family API

# Perfil ativo por padrão: "dev" carrega dados de demonstração
# (ver DataInitializer). Em produção (Azure), defina
# SPRING_PROFILES_ACTIVE=prod — ver application-prod.properties.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA / Hibernate — o schema é 100% gerenciado pelo Flyway
# (src/main/resources/db/migration). ddl-auto=validate apenas
# confere se as entidades batem com as tabelas migradas; nunca
# cria/altera nada em runtime, em nenhum perfil.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# SpringDoc / Swagger (acessar em /swagger-ui.html)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# Cache Caffeine
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# Segurança / JWT — o segredo e a expiração devem vir de variável
# de ambiente em qualquer ambiente real. O valor abaixo é apenas
# um fallback de desenvolvimento local.
jwt.secret=${JWT_SECRET:pet-family-dev-secret-troque-em-producao-min-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS — em desenvolvimento aceita qualquer origem (o app Expo
# roda em endereços variáveis: emulador, dispositivo físico, Expo
# Go). Em produção, defina CORS_ALLOWED_ORIGINS com uma lista
# separada por vírgula (ver application-prod.properties).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging
logging.level.br.com.fiap.petfamily=INFO
logging.level.org.springframework.cache=DEBUG

# Actuator — só o endpoint de health fica exposto (usado pelo health
# check do Azure App Service e pelo script de deploy). Sem detalhes
# de infraestrutura no corpo da resposta.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
